[project]
name = "agentproof"
version = "0.1.0"
description = "Verifiable execution and outcome grounding for autonomous AI agents"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "google-adk[gcp]>=2.0,<3.0",
  "google-genai>=1.0,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.27,<1.0"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["fixtures*", "scripts*", "tests*", "docs*"]
namespaces = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
