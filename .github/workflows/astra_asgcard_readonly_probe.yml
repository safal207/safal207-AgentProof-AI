name: Astra ASG Card read-only ledger probe

on:
  push:
    branches:
      - astra/asgcard-readonly-probe
    paths:
      - .github/workflows/astra_asgcard_readonly_probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  horizon-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Query public Stellar Horizon without credentials
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from typing import Any

          BASE = "https://horizon.stellar.org"
          ACCOUNT = "GDKCNIN2WTC6UAARM4Z2IEWVRQBKKTN5XYFAMR5LFE7I2ZXF5L22CVX5"
          INCIDENT = datetime.fromisoformat("2026-08-30T01:15:00+00:00")
          WINDOW_START = INCIDENT - timedelta(hours=18)
          WINDOW_END = INCIDENT + timedelta(hours=18)
          OUTPUT = Path("artifacts/asgcard_issue17_ledger_probe.json")
          OUTPUT.parent.mkdir(parents=True, exist_ok=True)

          def get_json(path: str) -> dict[str, Any]:
              request = urllib.request.Request(
                  f"{BASE}{path}",
                  headers={
                      "Accept": "application/hal+json, application/json",
                      "User-Agent": "Astra-Spider-read-only-probe/1.0",
                  },
                  method="GET",
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          def parse_time(value: Any) -> datetime | None:
              if not isinstance(value, str) or not value:
                  return None
              try:
                  parsed = datetime.fromisoformat(value.replace("Z", "+00:00"))
              except ValueError:
                  return None
              if parsed.tzinfo is None:
                  parsed = parsed.replace(tzinfo=timezone.utc)
              return parsed.astimezone(timezone.utc)

          def in_window(record: dict[str, Any]) -> bool:
              created = parse_time(record.get("created_at"))
              return bool(created and WINDOW_START <= created <= WINDOW_END)

          def records(payload: dict[str, Any]) -> list[dict[str, Any]]:
              embedded = payload.get("_embedded")
              if not isinstance(embedded, dict):
                  return []
              values = embedded.get("records")
              return values if isinstance(values, list) else []

          def keep(record: dict[str, Any], keys: tuple[str, ...]) -> dict[str, Any]:
              return {key: record[key] for key in keys if key in record}

          report: dict[str, Any] = {
              "probe": "asgcard-issue-17-stellar-mainnet-read-only",
              "probe_version": 1,
              "read_only": True,
              "network": "Stellar Mainnet",
              "horizon": BASE,
              "account": ACCOUNT,
              "incident_started_at": INCIDENT.isoformat().replace("+00:00", "Z"),
              "window_start": WINDOW_START.isoformat().replace("+00:00", "Z"),
              "window_end": WINDOW_END.isoformat().replace("+00:00", "Z"),
              "queried_at": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "errors": {},
          }

          endpoint_specs = {
              "payments": (
                  f"/accounts/{ACCOUNT}/payments?order=desc&limit=200",
                  (
                      "id", "paging_token", "created_at", "type", "transaction_hash",
                      "source_account", "from", "to", "funder", "account", "amount",
                      "asset_type", "asset_code", "asset_issuer",
                  ),
              ),
              "operations": (
                  f"/accounts/{ACCOUNT}/operations?order=desc&limit=200&include_failed=true",
                  (
                      "id", "paging_token", "created_at", "type", "type_i",
                      "transaction_hash", "source_account", "from", "to", "amount",
                      "asset_type", "asset_code", "asset_issuer", "successful",
                  ),
              ),
              "transactions": (
                  f"/accounts/{ACCOUNT}/transactions?order=desc&limit=200&include_failed=true",
                  (
                      "id", "paging_token", "created_at", "hash", "successful",
                      "source_account", "source_account_sequence", "fee_account",
                      "fee_charged", "max_fee", "operation_count", "memo_type", "memo",
                  ),
              ),
              "effects": (
                  f"/accounts/{ACCOUNT}/effects?order=desc&limit=200",
                  (
                      "id", "paging_token", "created_at", "type", "type_i", "account",
                      "amount", "asset_type", "asset_code", "asset_issuer", "limit",
                      "trustor", "seller", "offer_id",
                  ),
              ),
          }

          transaction_hashes: set[str] = set()
          for name, (path, keys) in endpoint_specs.items():
              try:
                  payload = get_json(path)
                  selected = [keep(item, keys) for item in records(payload) if in_window(item)]
                  report[name] = selected
                  for item in selected:
                      value = item.get("transaction_hash") or item.get("hash")
                      if isinstance(value, str) and value:
                          transaction_hashes.add(value)
              except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, json.JSONDecodeError) as exc:
                  report["errors"][name] = f"{type(exc).__name__}: {exc}"
                  report[name] = []

          try:
              account_payload = get_json(f"/accounts/{ACCOUNT}")
              balances = account_payload.get("balances", [])
              report["current_balances"] = [
                  keep(
                      item,
                      (
                          "asset_type", "asset_code", "asset_issuer", "balance",
                          "buying_liabilities", "selling_liabilities", "limit",
                      ),
                  )
                  for item in balances
                  if isinstance(item, dict)
              ]
              report["account_sequence"] = account_payload.get("sequence")
              report["account_last_modified_ledger"] = account_payload.get("last_modified_ledger")
              report["account_last_modified_time"] = account_payload.get("last_modified_time")
          except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, json.JSONDecodeError) as exc:
              report["errors"]["account"] = f"{type(exc).__name__}: {exc}"
              report["current_balances"] = []

          details: dict[str, Any] = {}
          for tx_hash in sorted(transaction_hashes)[:30]:
              tx_detail: dict[str, Any] = {}
              for suffix, keys in (
                  (
                      "operations",
                      (
                          "id", "created_at", "type", "type_i", "transaction_hash",
                          "source_account", "from", "to", "amount", "asset_type",
                          "asset_code", "asset_issuer", "successful",
                      ),
                  ),
                  (
                      "effects",
                      (
                          "id", "created_at", "type", "type_i", "account", "amount",
                          "asset_type", "asset_code", "asset_issuer", "limit", "trustor",
                      ),
                  ),
              ):
                  try:
                      payload = get_json(f"/transactions/{tx_hash}/{suffix}?order=asc&limit=200")
                      tx_detail[suffix] = [keep(item, keys) for item in records(payload)]
                  except (urllib.error.URLError, urllib.error.HTTPError, TimeoutError, json.JSONDecodeError) as exc:
                      tx_detail[f"{suffix}_error"] = f"{type(exc).__name__}: {exc}"
              details[tx_hash] = tx_detail
          report["transaction_details"] = details

          usdc_outgoing = []
          for item in report.get("payments", []):
              if not isinstance(item, dict):
                  continue
              source = item.get("from") or item.get("source_account")
              if source != ACCOUNT:
                  continue
              if item.get("asset_code") != "USDC":
                  continue
              usdc_outgoing.append(item)
          report["candidate_outgoing_usdc_payments"] = usdc_outgoing

          OUTPUT.write_text(
              json.dumps(report, indent=2, sort_keys=True, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          print(OUTPUT.read_text(encoding="utf-8"))
          print(f"ASTRA_REPORT_PATH={OUTPUT}")
          PY

      - name: Upload sanitized read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asgcard-issue17-ledger-probe
          path: artifacts/asgcard_issue17_ledger_probe.json
          if-no-files-found: error
          retention-days: 14
